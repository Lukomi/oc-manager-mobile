name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev wget unzip

      - name: Install Aidl (fallback method)
        run: |
          # 装上 libc++ 运行时库（aidl 依赖它）
          sudo apt install -y libc++1 libc++abi1 || sudo apt install -y libc++-dev

          # 下载 Android Build Tools 拿 aidl
          wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q build-tools_r34-linux.zip
          sudo mkdir -p /opt/android-sdk/build-tools/34.0.0
          sudo cp android-14/aidl /opt/android-sdk/build-tools/34.0.0/aidl
          sudo chmod +x /opt/android-sdk/build-tools/34.0.0/aidl
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aidl /usr/local/bin/aidl

          # 测试能不能跑
          aidl --version

      - name: Install Buildozer
        run: |
          pip install --user buildozer cython

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oc-manager-apk
          path: bin/*.apk