name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev wget unzip

      - name: Install Aidl (fallback method)
        run: |
          # 先看看 apt 里有没有
          if ! command -v aidl >/dev/null 2>&1; then
            echo "aidl 不在 apt 里，手动从 Android SDK 下载"
            wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
            unzip -q build-tools_r34-linux.zip
            sudo mkdir -p /opt/android-sdk/build-tools/34.0.0
            sudo cp android-14/aidl /opt/android-sdk/build-tools/34.0.0/aidl
            sudo chmod +x /opt/android-sdk/build-tools/34.0.0/aidl
            sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aidl /usr/local/bin/aidl
          fi
          aidl --version

      - name: Install Buildozer
        run: |
          pip install --user buildozer cython

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oc-manager-apk
          path: bin/*.apk